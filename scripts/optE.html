<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: #f8fafc;
    }
    .container {
      position: relative;
      width: 1200px;
      height: 630px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #ffffff 0%, #f6f8fc 100%);
      overflow: hidden;
    }
    .grid {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(15, 23, 42, 0.08) 1.5px, transparent 1.5px);
      background-size: 28px 28px;
    }
    .glow {
      position: absolute;
      width: 750px;
      height: 480px;
      background: radial-gradient(circle, rgba(81, 112, 255, 0.14) 0%, rgba(81, 112, 255, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -55%);
      filter: blur(45px);
    }
    .stage {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: -12px;
    }
    .flip-pill {
      margin-top: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 24px;
      border-radius: 9999px;
      background: #ffffff;
      border: 2px solid #5170FF;
      color: #5170FF;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      box-shadow: 0 3px 12px rgba(81, 112, 255, 0.12);
    }
    .categories-row {
      margin-top: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .cat-pill {
      padding: 7px 18px;
      border-radius: 9999px;
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      color: #334155;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .cat-pill.active {
      background: #5170FF;
      border-color: #5170FF;
      color: #ffffff;
      box-shadow: 0 3px 10px rgba(81, 112, 255, 0.25);
    }
    
  .card-fan {
    position: relative;
    width: 660px;
    height: 380px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    position: absolute;
    width: 250px;
    height: 350px;
    border-radius: 18px;
    overflow: hidden;
    background: #5170FF;
    transform-origin: 50% 120%;
  }
  .card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    border-radius: 18px;
  }
  .card-left {
    transform: translateX(-135px) translateY(12px) rotate(-9deg);
    z-index: 10;
    box-shadow: 0 16px 32px -8px rgba(15, 23, 42, 0.2), 0 0 0 1px rgba(15, 23, 42, 0.05);
  }
  .card-center {
    transform: translateX(0px) translateY(-14px) rotate(0deg) scale(1.03);
    z-index: 30;
    box-shadow: 0 28px 56px -10px rgba(15, 23, 42, 0.32), 0 0 0 1px rgba(15, 23, 42, 0.08);
  }
  .card-right {
    transform: translateX(135px) translateY(12px) rotate(9deg);
    z-index: 10;
    box-shadow: 0 16px 32px -8px rgba(15, 23, 42, 0.2), 0 0 0 1px rgba(15, 23, 42, 0.05);
  }

  </style>
</head>
